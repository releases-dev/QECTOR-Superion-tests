name: CI
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: |
          if [ -f src/lib.rs ]; then cargo test --lib; else echo "wheels-only — skip cargo"; fi
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          if [ -d qector_proofs ]; then
            curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain leanprover/lean4:v4.33.1
            export PATH="$HOME/.elan/bin:$PATH"
            lean --version; lake --version
            cd qector_proofs && lake build QectorProofs.Basic && echo "lake GREEN"
          else echo "no qector_proofs — skip lean"; fi
  wheels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - run: |
          python -m pip install --break-system-packages -q numpy
          python -m pip install --break-system-packages --force-reinstall wheels/*cp311*manylinux*.whl -q
          python -c "import qector_ionq; print(qector_ionq.__version__)"
          python python/smoke_test.py --no-cert
